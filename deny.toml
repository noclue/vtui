# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run with: cargo deny check

[graph]
all-features = false

[advisories]
# RustSec advisory DB; vulnerabilities are always errors, these tune the rest.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
# vtui is Apache-2.0: allow only permissive licenses compatible with it.
# Copyleft (GPL/LGPL/AGPL/MPL...) is rejected unless offered as an OR alternative.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    # Mozilla CA bundle data (webpki-root-certs)
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The allow list is a policy, not an inventory: don't warn for entries no dependency uses yet.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
ignore = true

[bans]
# Duplicate versions are common in the ecosystem; surface them without failing.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
